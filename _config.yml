title: Jannik Kühnemundt
tagline: Notes from my desk.
description: Software development, side projects and the problems I run into along the way.
url: "https://www.kuehnemundt.com"
baseurl: ""
lang: en

# Set to true once there are enough notes to group by topic.
show_topics: false
# Set to true once the first notes are published.
show_notes: true
# One line on the home page about what you're working on. Leave empty to hide.
# Planned note titles go in _data/upcoming.yml instead and replace this line.
up_next: "Currently tinkering with AI agents and MCP servers. Notes will follow."
timezone: Europe/Berlin

author:
  name: Jannik Kühnemundt
  url: https://www.kuehnemundt.com/about/
  role: Senior software engineer · C#/.NET · Lübeck

# Keeps old URLs working, e.g. /comments-in-code/
permalink: /:title/

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  hard_wrap: false

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

# Tells search engines that these profiles belong to the same person (schema.org sameAs)
social:
  name: Jannik Kühnemundt
  links:
    - https://github.com/jkuehnemundt
    - https://linkedin.com/in/kuehnemundt

# Paste the code from Google Search Console here (Settings → Ownership verification → HTML tag)
# google_site_verification: "..."

feed:
  path: feed.xml

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      nav: Notes
  - scope:
      path: ""
    values:
      layout: page
      # Preview image for LinkedIn, Slack, etc. (jekyll-seo-tag)
      image: /assets/img/og-image.png

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - scripts/
  - vendor/
  - node_modules/
  - .obsidian/
